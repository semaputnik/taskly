name: Publish Docker image

# A tag is the release signal: pushing v1.2.3 builds the application image and
# publishes it to Docker Hub. Pushes to master publish nothing, so a commit is
# released only once a tag names it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  # Two tags pushed one after the other publish two different images, so a run
  # in flight is left to finish rather than cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  publish:
    # Do not publish the template repository, only projects created from it
    if: github.repository != 'fastapi/full-stack-fastapi-template'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Docker Hub account is configured
        # Without this the run would fail inside the login action with an
        # unhelpful message about an empty username.
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Set the DOCKERHUB_USERNAME repository variable and the DOCKERHUB_TOKEN repository secret (see deployment-docker-compose.md)." >&2
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/taskly
          # The tag v1.2.3 publishes 1.2.3, 1.2 and latest. A pre-release tag
          # such as v1.2.3-rc.1 publishes only its own version and leaves latest
          # pointing at the last stable release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
