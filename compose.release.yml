# Runs a published Taskly image on a server.
#
# Unlike compose.yml this file builds nothing, so the server needs only this
# file and an .env beside it — no checkout of the repository. The image is the
# one .github/workflows/publish-docker-image.yml pushes on a version tag, and
# it carries both the API and the prebuilt frontend.
#
#   docker compose -f compose.release.yml pull
#   docker compose -f compose.release.yml up -d
#
# Migrations are not a step to remember: the `prestart` service below runs
# them, and the application is not started until it has finished.
#
# See deployment-docker-compose.md for the full procedure.

# Named explicitly so the volumes below keep their names wherever the file is
# placed on the server.
name: taskly

# What the migration step and the application both run: the same image, the
# same settings, the same attachment store. Held once rather than copied, so
# a setting added later cannot reach one of them and not the other — which is
# the shape of bug this file is fixing.
x-taskly: &taskly
  # Pin TASKLY_TAG to the released version, such as 1.2.3, so that a restart
  # brings back the same image rather than whatever latest points at now.
  image: ${TASKLY_IMAGE:?Variable not set}:${TASKLY_TAG:-latest}
  environment:
    PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
    SECRET_KEY: ${SECRET_KEY:?Variable not set}
    FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
    FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
    SMTP_HOST: ${SMTP_HOST}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
    SENTRY_DSN: ${SENTRY_DSN:-}
    ATTACHMENTS_DIR: /data/attachments
    FRONTEND_HOST: https://${DOMAIN:?Variable not set}
  volumes:
    - attachments-data:/data/attachments

services:

  proxy:
    image: traefik:v3.7
    restart: always
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "80:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the volume to store the certificates
      - traefik-certificates:/certificates
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Store the Let's Encrypt certificates in the mounted volume
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      # Use the TLS Challenge for Let's Encrypt
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  # The database brought to the schema this image expects, and the first
  # superuser created, before anything serves a request. It runs to
  # completion and stays exited; `backend` waits for that.
  #
  # A step in the deployment instructions was not enough: skipping it
  # published an image whose code wanted a column the database did not have,
  # and the application crash-looped on every request (#124). This is also
  # why it is a service of its own rather than the backend's own command —
  # the application runs four workers, and four of them racing on `alembic
  # upgrade` is a different way to break the same thing.
  prestart:
    <<: *taskly
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "scripts/prestart.sh"]

  backend:
    <<: *taskly
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTPS traffic for this domain
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.backend-https.tls.certresolver=le

volumes:
  app-db-data:
  attachments-data:
  # Create a volume to store the certificates, even if the container is recreated
  traefik-certificates:
